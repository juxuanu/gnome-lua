<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The system bus of the nested shell (tools/podman/run-nested.sh). No
     service runs or can be activated on it: clients find the system services
     missing, as on a machine without them, instead of failing to connect. A
     shell without any system bus never finishes initializing the parental
     controls, and then shows no application and never ends a search. -->
<busconfig>
  <type>system</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
  </policy>
</busconfig>
